server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pos_supermarket
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    # 512-bit secret (64 bytes hex) — at least 256 bits as required by RNF-05
    secret: 7a4f2c8e1b9d3f6a0e5c7b2d4f8a1e3c6b9d2f5a8e1c4b7d0f3a6c9e2b5d8f1a4c7e0b3d6f9a2c5e8b1d4f7a0c3e6b9d2f5a8e1c4b7d0f3a6c9e2b5d8f1a
    expiration-ms: 28800000  # 8 hours in milliseconds (RNF-05)

  cors:
    allowed-origins: http://localhost:5173  # Frontend origin (RNF-08)

logging:
  level:
    com.pos.supermarket: INFO
    org.springframework.security: WARN
