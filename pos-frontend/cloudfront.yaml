AWSTemplateFormatVersion: '2010-09-09'
Description: POS Frontend — S3 + CloudFront con OAC (HTTPS, bucket privado)

Parameters:
  BucketName:
    Type: String
    Default: pos-supermarket-frontend
    Description: Nombre del bucket S3 (ya creado)

Resources:

  # Origin Access Control — permite a CloudFront leer el bucket privado
  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: pos-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # Bucket policy — solo CloudFront puede leer los objetos
  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${BucketName}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'

  # Distribución CloudFront
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: POS Supermercado Frontend
        DefaultRootObject: index.html
        HttpVersion: http2
        PriceClass: PriceClass_100  # Solo América del Norte y Europa (más barato)

        Origins:
          - Id: S3Origin
            DomainName: !Sub '${BucketName}.s3.${AWS::Region}.amazonaws.com'
            S3OriginConfig:
              OriginAccessIdentity: ''   # vacío cuando se usa OAC
            OriginAccessControlId: !GetAtt FrontendOAC.Id

        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]

        # SPA routing — redirige 403/404 a index.html para que React Router funcione
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  CloudFrontURL:
    Description: URL del frontend (HTTPS)
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  DistributionId:
    Description: ID de la distribución CloudFront (para invalidaciones)
    Value: !Ref FrontendDistribution
